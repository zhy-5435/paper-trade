brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0
deleteWhen = 04
fileReservedTime = 48
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH
# Windows 端口映射必需：客户端从 namesrv 拿到的 broker 地址须为宿主机可达 IP（R1）
brokerIP1 = 127.0.0.1
listenPort = 10911
# 演示口径：自动创建 topic 与订阅组
autoCreateTopicEnable = true
autoCreateSubscriptionGroup = true