server:
  port: 8080

spring:
  application:
    name: paper-trade
  config:
    import: optional:file:./application-local.yml
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/stock_sim?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: ${MYSQL_PASSWORD:}
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss.SSS
    time-zone: Asia/Shanghai

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

knife4j:
  enable: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

stocksim:
  jwt:
    secret: ${JWT_SECRET:change-me-at-least-32-bytes-long-secret}
    expire-hours: 24
  snowflake:
    worker-id: 1
    datacenter-id: 1
  trade:
    session-check-enabled: false
    commission-rate: 0.00025
    commission-min: 5
    stamp-tax-rate: 0.0005
  quote:
    refresh-interval-ms: 3000
    walk-step-ratio: 0.002